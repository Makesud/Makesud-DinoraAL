# Dinora AI Controller 0.3 — ko‘p nuqta + xavfsizlik (STOP, ovoz tugmasi, avto-to‘xtash).
# Bu bitta fayl butun loyihani o'zi yaratadi va debug APK quradi.
# Joylashuvi repoda: .github/workflows/build.yml

name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Loyiha fayllarini yaratish
        run: |
          mkdir -p proj/app/src/main/java/com/dinora/controller
          mkdir -p proj/app/src/main/res/xml
          mkdir -p proj/app/src/main/res/values
          cd proj

          echo "" | base64 -d > debug.keystore

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DinoraAIController"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dinora.controller"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.dinora.controller"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "0.3"
              }

              signingConfigs {
                  getByName("debug") {
                      storeFile = file("../debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Dinora AI Controller"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DroneAccessibilityService"
                      android:label="Dinora AI Controller"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/service_description"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="service_description">O‘yin ustida suzuvchi panel ko‘rsatadi va ekranga tap yuboradi.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/dinora/controller/MainActivity.kt <<'EOF'
          package com.dinora.controller

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(30, 40, 30, 30)

                  val label = TextView(this)
                  label.text = "Dinora AI Controller — prototip 0.3\nSuzuvchi panel va avto-tap. AI ko‘rish hali qo‘shilmagan."
                  label.textSize = 18f

                  val settings = Button(this)
                  settings.text = "Accessibility ruxsatini ochish"
                  settings.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  val panelBtn = Button(this)
                  panelBtn.text = "Suzuvchi panelni ko‘rsatish"
                  panelBtn.setOnClickListener {
                      val service = DroneAccessibilityService.instance
                      if (service == null) {
                          label.text = "Accessibility xizmati yoqilmagan. Avval ruxsatni yoqing."
                      } else {
                          service.showPanel()
                          label.text = "Panel ekranda. Endi o‘yinni oching."
                      }
                  }

                  val test = Button(this)
                  test.text = "Sinov tap"
                  test.setOnClickListener {
                      val service = DroneAccessibilityService.instance
                      if (service == null) {
                          label.text = "Accessibility xizmati yoqilmagan. Avval ruxsatni yoqing."
                      } else {
                          service.tap(500f, 900f)
                          label.text = "Sinov tap yuborildi."
                      }
                  }

                  box.addView(label)
                  box.addView(settings)
                  box.addView(panelBtn)
                  box.addView(test)
                  setContentView(box)
              }
          }
          EOF

          cat > app/src/main/java/com/dinora/controller/DroneAccessibilityService.kt <<'EOF'
          package com.dinora.controller

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView

          class DroneAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: DroneAccessibilityService? = null

                  // Xavfsizlik: ikki tap orasidagi eng kichik masofa (barcha nuqtalar uchun umumiy)
                  const val MIN_INTERVAL = 200L
                  const val MAX_INTERVAL = 3000L
                  const val MAX_MARKERS = 100
              }

              private class Mk(val view: TextView, val params: WindowManager.LayoutParams)

              private val handler = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private var panel: LinearLayout? = null
              private val markers = ArrayList<Mk>()
              private var targets: List<Pair<Float, Float>> = emptyList()
              private var nextIndex = 0
              private var statusView: TextView? = null
              private var startButton: TextView? = null
              private var intervalView: TextView? = null
              private var timeView: TextView? = null

              // Avto-to'xtash vaqti (soniya)
              private val timeOptions = intArrayOf(15, 30, 60, 120, 300)
              private var timeIdx = 1

              private var running = false
              private var intervalMs = 300L

              // Bitta umumiy navbat: nuqtalar birin-ketin, har tap orasida intervalMs
              private val tapLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      if (targets.isNotEmpty()) {
                          val t = targets[nextIndex % targets.size]
                          nextIndex++
                          // Panel ustiga hech qachon tap tushmasin
                          if (!overPanel(t.first, t.second)) {
                              tap(t.first, t.second, 40L)
                          }
                      }
                      handler.postDelayed(this, intervalMs)
                  }
              }

              private val autoStop = Runnable {
                  if (running) {
                      stopRunning()
                      setStatus("Vaqt tugadi, o‘zi to‘xtadi.")
                  }
              }

              override fun onServiceConnected() {
                  instance = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  showPanel()
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  hidePanel()
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  stopRunning()
              }

              // Ovoz tugmasi (+ yoki −) ishlayotgan vaqtda hamma narsani to'xtatadi
              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode
                  if (running && (code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN)) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          stopRunning()
                          setStatus("Ovoz tugmasi bilan to‘xtatildi.")
                      }
                      return true
                  }
                  return super.onKeyEvent(event)
              }

              fun tap(x: Float, y: Float, duration: Long = 80L) {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, duration))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, duration: Long = 250L) {
                  val path = Path().apply {
                      moveTo(x1, y1)
                      lineTo(x2, y2)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, duration))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              // ---------- Suzuvchi panel ----------

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun roundRect(color: Int, radiusDp: Int = 10): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(radiusDp).toFloat()
                  return d
              }

              private fun overlayParams(w: Int, h: Int, touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) {
                      flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  val p = WindowManager.LayoutParams(
                      w,
                      h,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  return p
              }

              private fun makeButton(text: String, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.setTextColor(Color.WHITE)
                  t.textSize = 16f
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(12), dp(10), dp(12), dp(10))
                  t.background = roundRect(Color.argb(60, 255, 255, 255))
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun cellParams(): LinearLayout.LayoutParams {
                  val l = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  l.setMargins(dp(3), dp(3), dp(3), dp(3))
                  return l
              }

              private fun attachDrag(handle: View, target: View, p: WindowManager.LayoutParams) {
                  var startX = 0f
                  var startY = 0f
                  var origX = 0
                  var origY = 0
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = e.rawX
                              startY = e.rawY
                              origX = p.x
                              origY = p.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              p.x = origX + (e.rawX - startX).toInt()
                              p.y = origY + (e.rawY - startY).toInt()
                              wm?.updateViewLayout(target, p)
                              true
                          }
                          else -> true
                      }
                  }
              }

              private fun setStatus(msg: String) {
                  statusView?.text = msg
              }

              private fun changeInterval(delta: Long) {
                  intervalMs = (intervalMs + delta).coerceIn(MIN_INTERVAL, MAX_INTERVAL)
                  intervalView?.text = "$intervalMs ms"
              }

              private fun cycleTime() {
                  if (running) return
                  timeIdx = (timeIdx + 1) % timeOptions.size
                  timeView?.text = "⏱ " + timeOptions[timeIdx] + " s"
              }

              private fun overPanel(x: Float, y: Float): Boolean {
                  val pn = panel ?: return false
                  val loc = IntArray(2)
                  pn.getLocationOnScreen(loc)
                  return x >= loc[0] && x <= loc[0] + pn.width && y >= loc[1] && y <= loc[1] + pn.height
              }

              fun showPanel() {
                  if (panel != null) return
                  val w = wm ?: return

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = roundRect(Color.argb(210, 20, 20, 30), 14)
                  box.setPadding(dp(8), dp(6), dp(8), dp(8))

                  val p = overlayParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      true
                  )
                  p.x = dp(12)
                  p.y = dp(80)

                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL
                  val handle = TextView(this)
                  handle.text = "☰ Dinora  (ushlab suring)"
                  handle.setTextColor(Color.WHITE)
                  handle.textSize = 14f
                  handle.setPadding(dp(8), dp(10), dp(16), dp(10))
                  attachDrag(handle, box, p)
                  val close = makeButton("✕") { hidePanel() }
                  header.addView(handle)
                  header.addView(close)

                  val status = TextView(this)
                  status.setTextColor(Color.LTGRAY)
                  status.textSize = 12f
                  status.maxWidth = dp(240)
                  status.setPadding(dp(8), dp(2), dp(8), dp(6))
                  status.text = "Tayyor. + Nuqta bilan belgi qo‘shing."
                  statusView = status

                  val row1 = LinearLayout(this)
                  row1.orientation = LinearLayout.HORIZONTAL
                  val addBtn = makeButton("+ Nuqta") { addMarker() }
                  val delBtn = makeButton("− Nuqta") { removeLastMarker() }
                  row1.addView(addBtn, cellParams())
                  row1.addView(delBtn, cellParams())

                  val row2 = LinearLayout(this)
                  row2.orientation = LinearLayout.HORIZONTAL
                  val startBtn = makeButton("▶ Start") {
                      if (running) stopRunning() else startRunning()
                  }
                  startBtn.textSize = 18f
                  startButton = startBtn
                  row2.addView(startBtn, cellParams())

                  val row3 = LinearLayout(this)
                  row3.orientation = LinearLayout.HORIZONTAL
                  val minus = makeButton("−") { changeInterval(-50L) }
                  val label = TextView(this)
                  label.setTextColor(Color.WHITE)
                  label.textSize = 15f
                  label.gravity = Gravity.CENTER
                  label.text = "$intervalMs ms"
                  intervalView = label
                  val plus = makeButton("+") { changeInterval(50L) }
                  row3.addView(minus, cellParams())
                  row3.addView(label, cellParams())
                  row3.addView(plus, cellParams())

                  val row4 = LinearLayout(this)
                  row4.orientation = LinearLayout.HORIZONTAL
                  val timeBtn = makeButton("⏱ " + timeOptions[timeIdx] + " s") { cycleTime() }
                  timeView = timeBtn
                  val clearBtn = makeButton("✕ Hammasi") { clearMarkers() }
                  row4.addView(timeBtn, cellParams())
                  row4.addView(clearBtn, cellParams())

                  box.addView(header)
                  box.addView(status)
                  box.addView(row1)
                  box.addView(row2)
                  box.addView(row3)
                  box.addView(row4)

                  w.addView(box, p)
                  panel = box
              }

              fun hidePanel() {
                  stopRunning()
                  val w = wm
                  if (w != null) {
                      for (m in markers) {
                          w.removeView(m.view)
                      }
                  }
                  markers.clear()
                  val pn = panel
                  if (w != null && pn != null) {
                      w.removeView(pn)
                  }
                  panel = null
              }

              // ---------- Nuqtalar (belgilar) ----------

              private fun renumber() {
                  for (i in 0 until markers.size) {
                      markers[i].view.text = (i + 1).toString()
                  }
              }

              private fun addMarker() {
                  if (running) return
                  val w = wm ?: return
                  if (markers.size >= MAX_MARKERS) {
                      setStatus("Eng ko‘pi $MAX_MARKERS ta nuqta.")
                      return
                  }
                  val size = dp(44)
                  val v = TextView(this)
                  v.gravity = Gravity.CENTER
                  v.setTextColor(Color.WHITE)
                  v.textSize = 12f
                  val ring = GradientDrawable()
                  ring.shape = GradientDrawable.OVAL
                  ring.setColor(Color.argb(70, 255, 0, 0))
                  ring.setStroke(dp(2), Color.RED)
                  v.background = ring

                  val p = overlayParams(size, size, true)
                  val dm = resources.displayMetrics
                  val n = markers.size
                  p.x = dm.widthPixels / 2 - size / 2 + ((n % 7) - 3) * dp(16)
                  p.y = dm.heightPixels / 2 - size / 2 + (((n / 7) % 7) - 3) * dp(16)

                  val mk = Mk(v, p)
                  attachMarkerTouch(mk)
                  w.addView(v, p)
                  markers.add(mk)
                  renumber()
                  setStatus("" + markers.size + " ta nuqta. Sudrab joylang. O‘chirish: belgini uzoq bosing.")
              }

              private fun attachMarkerTouch(mk: Mk) {
                  var startX = 0f
                  var startY = 0f
                  var origX = 0
                  var origY = 0
                  var moved = false
                  mk.view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = e.rawX
                              startY = e.rawY
                              origX = mk.params.x
                              origY = mk.params.y
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - startX
                              val dy = e.rawY - startY
                              if (Math.abs(dx) > dp(8) || Math.abs(dy) > dp(8)) {
                                  moved = true
                              }
                              mk.params.x = origX + dx.toInt()
                              mk.params.y = origY + dy.toInt()
                              wm?.updateViewLayout(mk.view, mk.params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved && e.eventTime - e.downTime > 600L) {
                                  handler.post { removeMarker(mk) }
                              }
                              true
                          }
                          else -> true
                      }
                  }
              }

              private fun removeMarker(mk: Mk) {
                  if (running) return
                  val w = wm ?: return
                  if (!markers.remove(mk)) return
                  w.removeView(mk.view)
                  renumber()
                  setStatus("" + markers.size + " ta nuqta qoldi.")
              }

              private fun removeLastMarker() {
                  if (running || markers.isEmpty()) return
                  removeMarker(markers[markers.size - 1])
              }

              private fun clearMarkers() {
                  if (running) return
                  val w = wm ?: return
                  for (m in markers) {
                      w.removeView(m.view)
                  }
                  markers.clear()
                  setStatus("Hamma nuqtalar o‘chirildi.")
              }

              private fun setMarkersTouchable(touchable: Boolean) {
                  val w = wm ?: return
                  for (m in markers) {
                      m.params.flags = if (touchable) {
                          m.params.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                      } else {
                          m.params.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      }
                      w.updateViewLayout(m.view, m.params)
                  }
              }

              // ---------- Start / Stop ----------

              private fun startRunning() {
                  if (markers.isEmpty()) {
                      setStatus("Avval + Nuqta bosib, belgini o‘yin tugmasi ustiga qo‘ying.")
                      return
                  }
                  val list = ArrayList<Pair<Float, Float>>()
                  for (m in markers) {
                      val loc = IntArray(2)
                      m.view.getLocationOnScreen(loc)
                      list.add(Pair(loc[0] + m.view.width / 2f, loc[1] + m.view.height / 2f))
                  }
                  targets = list
                  nextIndex = 0
                  setMarkersTouchable(false)
                  running = true
                  startButton?.text = "■ STOP"
                  setStatus("Ishlayapti: " + list.size + " nuqta, " + intervalMs + " ms. Ovoz tugmasi ham to‘xtatadi.")
                  handler.post(tapLoop)
                  handler.postDelayed(autoStop, timeOptions[timeIdx] * 1000L)
              }

              private fun stopRunning() {
                  running = false
                  handler.removeCallbacks(tapLoop)
                  handler.removeCallbacks(autoStop)
                  startButton?.text = "▶ Start"
                  setMarkersTouchable(true)
                  setStatus("To‘xtadi.")
              }
          }
          EOF

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK yig'ish
        working-directory: proj
        run: gradle :app:assembleDebug --no-daemon

      - name: APK'ni yuklab olishga tayyorlash
        uses: actions/upload-artifact@v4
        with:
          name: DinoraAIController-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
